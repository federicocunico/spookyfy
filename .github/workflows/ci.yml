name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # ffmpeg vero per il test dell'auto-trim sul server (silencedetect), come sui server di casa.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pnpm test
      # Limite del piano Hobby di Vercel: al massimo 12 funzioni serverless nel gateway.
      - run: pnpm --filter @spookyfy/gateway count-functions
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @spookyfy/e2e exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report

  # Deploy della modalità client (gateway + PWA) su Vercel dopo i test, solo da main.
  # Il build avviene qui su Linux: un build fatto su Windows non funziona su Vercel.
  deploy-vercel:
    runs-on: ubuntu-latest
    needs: [check, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency: vercel-production
    environment:
      name: vercel-production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Secret di Vercel presenti
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo '::error::Mancano i secret VERCEL_TOKEN, VERCEL_ORG_ID o VERCEL_PROJECT_ID (vedi docs/deploy-vercel.md)'
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: npm install --global vercel@50.32.3
      # La CLI legge prima il team: un token limitato al progetto riceve 403 e pull fallisce senza spiegazioni.
      - name: Token Vercel con accesso al team
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v2/teams/$VERCEL_ORG_ID")
          if [ "$code" != 200 ]; then
            echo "::error::Il token Vercel non può leggere il team (HTTP $code): crealo su vercel.com/account/settings/tokens con scope il team del progetto (vedi docs/deploy-vercel.md)"
            exit 1
          fi
      - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: vercel build --prod --token="$VERCEL_TOKEN"
      - id: deploy
        run: echo "url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")" >> "$GITHUB_OUTPUT"
      # Il dominio di produzione risponde e si presenta in modalità client.
      - run: curl --fail --silent --show-error "$PRODUCTION_URL/api/health" | grep '"mode":"client"'
        env:
          PRODUCTION_URL: ${{ vars.VERCEL_PRODUCTION_URL }}

  # Registrazione, sessione e ricerca sul deploy appena pubblicato (API e browser).
  verify-production:
    needs: deploy-vercel
    uses: ./.github/workflows/verify-production.yml
    secrets: inherit
